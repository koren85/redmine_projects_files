services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: redmine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db:/var/lib/postgresql/data
  redmine:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ..
      dockerfile: integration/Dockerfile
    ports:
      - "127.0.0.1:3041:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: local_test_only
      REDMINE_DB_DATABASE: redmine
    volumes:
      - files:/usr/src/redmine/files
volumes:
  db:
  files:
